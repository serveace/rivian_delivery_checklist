<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f0d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Rivian Delivery QC Companion</title>

  <link rel="manifest" href="manifest.json" />

  <style>
    :root {
      --bg-dark: #0b0f0d;
      --surface: #18221d;
      --surface-light: #233029;
      --border: #2c3d34;
      --gold: #e5a93c;
      --gold-hover: #c9922f;
      --accent: #2ed47a;
      --danger: #e05353;
      --blocker: #ff334b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --nav-bottom-clearance: max(88px, calc(68px + env(safe-area-inset-bottom, 0px)));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    input, textarea {
      user-select: text;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(11, 15, 13, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .container {
      max-width: 768px;
      margin: 0 auto;
      width: 100%;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-row h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .badge-r1 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(229, 169, 60, 0.18);
      color: var(--gold);
      border: 1px solid rgba(229, 169, 60, 0.4);
    }

    .status-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .dot-active {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon:hover { color: #fff; }

    .btn-report {
      background: var(--gold);
      color: #0b0f0d;
      font-weight: 700;
      font-size: 12px;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-box {
      margin-top: 10px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--surface);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(44, 61, 52, 0.5);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      transition: width 0.3s ease;
    }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-btn.active {
      background: var(--gold);
      color: #0b0f0d;
      font-weight: 700;
      border-color: var(--gold);
    }

    main {
      flex: 1;
      padding: 16px;
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      transition: all 0.2s ease;
    }
    .item-card.is-issue {
      border-color: rgba(224, 83, 83, 0.7);
      box-shadow: 0 4px 20px rgba(224, 83, 83, 0.15);
    }
    .item-card.is-pass {
      border-color: rgba(46, 212, 122, 0.35);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .cat-tag {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(229, 169, 60, 0.9);
      display: block;
      margin-bottom: 2px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 4px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-pass { background: rgba(46, 212, 122, 0.15); color: var(--accent); border: 1px solid rgba(46, 212, 122, 0.4); }
    .badge-issue { background: rgba(224, 83, 83, 0.15); color: var(--danger); border: 1px solid rgba(224, 83, 83, 0.4); }
    .badge-na { background: #374151; color: #d1d5db; }

    .btn-group-toggle {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .toggle-btn {
      padding: 10px 0;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .toggle-btn.active-pass { background: var(--accent); color: #0b0f0d; border-color: var(--accent); font-weight: 700; }
    .toggle-btn.active-issue { background: var(--danger); color: #fff; border-color: var(--danger); font-weight: 700; }
    .toggle-btn.active-na { background: #4b5563; color: #fff; border-color: #4b5563; font-weight: 700; }

    .severity-bar {
      margin-bottom: 12px;
      padding: 10px 12px;
      background: rgba(11, 15, 13, 0.6);
      border: 1px solid rgba(224, 83, 83, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .severity-bar span { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .sev-pills { display: flex; gap: 6px; }
    .sev-btn {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: var(--surface-light);
      color: var(--text-muted);
    }
    .sev-btn.active-Cosmetic { background: #d1d5db; color: #111; font-weight: 700; }
    .sev-btn.active-Moderate { background: var(--gold); color: #0b0f0d; font-weight: 700; }
    .sev-btn.active-Blocker { background: var(--blocker); color: #fff; font-weight: 700; }

    .notes-box {
      margin-top: 10px;
    }
    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .notes-btns { display: flex; gap: 6px; }
    .btn-tool {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-tool.recording { background: #7f1d1d; color: #fff; border-color: #ef4444; }

    textarea {
      width: 100%;
      background: rgba(11, 15, 13, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: #fff;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }
    textarea:focus { border-color: var(--gold); }

    .media-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .media-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 60%;
    }
    .thumb-item {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .media-btns { display: flex; gap: 6px; }

    /* HARD CLEARANCE FOR ANDROID 3-BUTTON SYSTEM NAVIGATION */
    .android-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(11, 15, 13, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      padding-bottom: var(--nav-bottom-clearance) !important;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
    }
    .dock-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .android-scroll-spacer {
      height: calc(var(--nav-bottom-clearance) + 120px);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-window {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      background: rgba(11, 15, 13, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 13px;
    }
    .modal-footer {
      padding: 14px 20px;
      background: rgba(11, 15, 13, 0.9);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container">
      <div class="header-top">
        <div class="brand-wrap">
          <div class="logo-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
            </svg>
          </div>
          <div>
            <div class="title-row">
              <h1>Rivian Delivery QC</h1>
              <span class="badge-r1">R1S / R1T</span>
            </div>
            <div class="status-sub">
              <span class="dot-active"></span>
              <span id="db-status">IndexedDB Offline-Ready</span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <button id="btn-export-json" title="Backup to JSON" class="btn-icon">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
          </button>
          <button id="btn-import-trigger" title="Restore JSON" class="btn-icon">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>
          </button>
          <input type="file" id="import-file-input" style="display:none" accept=".json" />
          <button id="btn-open-report" class="btn-report">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>Report</span>
          </button>
        </div>
      </div>

      <!-- PROGRESS TRACKER -->
      <div class="progress-box">
        <div class="progress-labels">
          <span>Checked: <strong id="stat-completed" style="color:#fff;">0 / 31</strong></span>
          <span style="display:flex; gap:12px;">
            <span style="color:var(--accent);">✓ <span id="stat-pass">0</span></span>
            <span style="color:var(--danger);">⚠ <span id="stat-issues">0</span></span>
          </span>
        </div>
        <div class="progress-track">
          <div id="progress-bar-fill" class="progress-bar"></div>
        </div>
      </div>

      <!-- CATEGORY TABS -->
      <div id="category-pills" class="category-scroll"></div>
    </div>
  </header>

  <!-- MAIN LIST -->
  <main class="container">
    <div id="checklist-items-container" class="items-list"></div>
    <div class="android-scroll-spacer"></div>
  </main>

  <!-- FIXED BOTTOM DOCK (HARD 3-BUTTON CLEARANCE) -->
  <div class="android-dock">
    <div class="container dock-inner">
      <div>
        <div id="dock-issue-summary" style="font-size:13px; font-weight:700; color:#fff;">0 Issues Flagged</div>
        <div style="font-size:11px; color:var(--text-muted);">Bethel Park Service Center Handoff</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="btn-dock-filter-issues" class="btn-tool" style="padding:10px 14px; font-size:12px; font-weight:600;">
          <span id="dock-filter-text">Filter Issues</span>
        </button>
        <button id="btn-dock-report" class="btn-report" style="padding:10px 16px;">
          <span>Handoff Summary</span>
        </button>
      </div>
    </div>
  </div>

  <!-- SPECIALIST REPORT MODAL -->
  <div id="report-modal" class="modal-overlay hidden">
    <div class="modal-window">
      <div class="modal-header">
        <div>
          <h2 style="font-size:15px; font-weight:700; color:#fff;">Delivery Specialist Handoff Ticket</h2>
          <p style="font-size:11px; color:var(--text-muted);">Present this issue punch-list to Rivian before signing acceptance</p>
        </div>
        <button id="btn-close-report" class="btn-icon" style="padding:4px 8px;">✕</button>
      </div>
      <div id="report-modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="btn-copy-ticket" class="btn-tool" style="padding:8px 12px; font-weight:600;">
          <span id="copy-ticket-text">📋 Copy Text Ticket</span>
        </button>
        <div style="display:flex; gap:8px;">
          <button id="btn-print-report" class="btn-tool" style="padding:8px 12px;">🖨 Print / PDF</button>
          <button id="btn-done-report" class="btn-report" style="padding:8px 16px;">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MEDIA MODAL -->
  <div id="media-modal" class="modal-overlay hidden">
    <div style="position:relative; max-width:90vw; max-height:85vh;">
      <button id="btn-close-media" class="btn-icon" style="position:absolute; top:-40px; right:0; color:#fff;">✕ Close</button>
      <div id="media-modal-container"></div>
    </div>
  </div>

  <!-- HIDDEN INPUTS -->
  <input type="file" id="camera-photo-input" accept="image/*" capture="environment" style="display:none" />
  <input type="file" id="camera-video-input" accept="video/*" capture="environment" style="display:none" />

  <!-- SCRIPTS -->
  <script>
    const CHECKLIST_CATEGORIES = [
      "1. Bring With You",
      "2. Trade-In Handover",
      "3. Paperwork & VIN",
      "4. Exterior & Glass",
      "5. Doors & Cargo",
      "6. Interior & Seating",
      "7. Tech & Lighting",
      "8. Gear & Emergency",
      "9. Acceptance Sign-off"
    ];

    const DEFAULT_ITEMS = [
      { id: "bw-1", category: "1. Bring With You", title: "Valid Driver's License", desc: "All registered co-owners must be present with unexpired physical government IDs." },
      { id: "bw-2", category: "1. Bring With You", title: "Smartphone with Rivian App logged in", desc: "Ready to pair Bluetooth digital phone key and confirm vehicle ownership transfer." },
      { id: "bw-3", category: "1. Bring With You", title: "Certified payment check (if applicable)", desc: "Only needed if an outstanding registration or state tax balance remains." },

      { id: "ti-1", category: "2. Trade-In Handover", title: "Physical Vehicle Title or Lien Payoff Info", desc: "Original title ready to sign or lender account payoff letter." },
      { id: "ti-2", category: "2. Trade-In Handover", title: "Remove Windshield E-ZPass Toll Transponder", desc: "Unmount physical pass and remove old license plate from tolling account." },
      { id: "ti-3", category: "2. Trade-In Handover", title: "Pennsylvania License Plate Transfer / Surrender", desc: "Keep license plate for transfer to R1S or prepare to return to PennDOT." },
      { id: "ti-4", category: "2. Trade-In Handover", title: "All Trade-In Keys & Fobs", desc: "Provide primary key fob, spare fob/valet keys, and wheel lock lug key if equipped." },
      { id: "ti-5", category: "2. Trade-In Handover", title: "Infotainment Factory Reset & App De-linking", desc: "Wipe paired phones, contacts, HomeLink garage codes, navigation home address, and logout manufacturer apps." },
      { id: "ti-6", category: "2. Trade-In Handover", title: "Cabin & Cargo Deep Cleanout", desc: "Check glovebox, center console, sunglasses holder, and under cargo floorboard." },
      { id: "ti-7", category: "2. Trade-In Handover", title: "Lot Arrival Odometer & Fuel/Battery Photo", desc: "Photograph dashboard odometer and fuel/state-of-charge level when parking at Bethel Park." },

      { id: "pv-1", category: "3. Paperwork & VIN", title: "VIN Verification on Windshield & B-Pillar", desc: "Confirm stamped VIN at base of windshield and door jamb match purchase documents exactly." },
      { id: "pv-2", category: "3. Paperwork & VIN", title: "Configuration & Options Match", desc: "Confirm exterior paint, interior trim, wheel design, and included options match the window sticker." },

      { id: "eg-1", category: "4. Exterior & Glass", title: "Body Paint, Seams & Panel Gaps", desc: "Inspect hood, doors, quarter panels, and bumpers in direct outdoor light for swirl marks, runs, or misalignments." },
      { id: "eg-2", category: "4. Exterior & Glass", title: "Windshield, Windows & Panoramic Glass Roof", desc: "Look closely for transit micro-chips, cracks, or seal rubber pinches around the panoramic roof." },
      { id: "eg-3", category: "4. Exterior & Glass", title: "Wheels, Tires & Valve Stem Caps", desc: "Check all 4 rims for transit curb rash; verify tire pressures and all 4 valve caps are present." },
      { id: "eg-4", category: "4. Exterior & Glass", title: "Underbody Shields & Aero Panels", desc: "Look underneath for loose splash guards, fluid drips, or transit scrapes on underbody armor." },

      { id: "dc-1", category: "5. Doors & Cargo", title: "Flush Exterior Door Handles & Latches", desc: "Check flush handle presentation, smooth motorized retraction, and seamless door latching." },
      { id: "dc-2", category: "5. Doors & Cargo", title: "Powered Frunk Operation", desc: "Cycle front trunk open and close via center display, fob, and exterior front bumper button." },
      { id: "dc-3", category: "5. Doors & Cargo", title: "Split-Tailgate / Rear Liftgate", desc: "Test power upper liftgate and motorized lower drop tailgate; check for alignment rub." },
      { id: "dc-4", category: "5. Doors & Cargo", title: "Motorized Charge Port Door", desc: "Open/close charge port door; verify flush fit and tight rubber weather seals." },

      { id: "is-1", category: "6. Interior & Seating", title: "Seat Adjustments, Heating & Ventilation", desc: "Test all power lumbar, tilt, heat, and cooled ventilation controls on front seats." },
      { id: "is-2", category: "6. Interior & Seating", title: "2nd & 3rd Row Folding Mechanism", desc: "Fold and latch second and third row seats; ensure release handles and buttons operate smoothly." },
      { id: "is-3", category: "6. Interior & Seating", title: "Interior Trim, Leather Stitching & Headliner", desc: "Check wood dashboard trim, headliner fabric, stitching seams, and floor mats for blemishes." },
      { id: "is-4", category: "6. Interior & Seating", title: "All Power Windows & Mirror Fold/Tilt", desc: "Test one-touch auto up/down on all 4 windows and power folding/reverse-tilt on side mirrors." },

      { id: "tl-1", category: "7. Tech & Lighting", title: "Phone-as-Key Pairing & Key Cards", desc: "Pair your smartphone with the Rivian app; verify NFC key card tap on driver B-pillar." },
      { id: "tl-2", category: "7. Tech & Lighting", title: "Driver & Center Touchscreens + 360 Cameras", desc: "Inspect screens for dead pixels and verify all 360-degree surround and blind-spot cameras." },
      { id: "tl-3", category: "7. Tech & Lighting", title: "Exterior Light Bars, Headlights & Turn Signals", desc: "Test front signature light bar, headlights, high beams, rear brake bar, and hazard signals." },
      { id: "tl-4", category: "7. Tech & Lighting", title: "Sound System, Bluetooth & Wireless Phone Charger", desc: "Stream audio across cabin speakers and verify dual wireless charging pad connection." },

      { id: "ge-1", category: "8. Gear & Emergency", title: "Driver Door Rechargeable Flashlight", desc: "Push to release door flashlight; verify charge contacts and bright LED beam." },
      { id: "ge-2", category: "8. Gear & Emergency", title: "Removable Camp Speaker in Center Console", desc: "Eject camp speaker, verify standalone power and audio, re-dock and confirm charging latch." },
      { id: "ge-3", category: "8. Gear & Emergency", title: "Front Emergency Mechanical Door Pulls", desc: "Locate manual mechanical pull cables inside the front door pockets." },
      { id: "ge-4", category: "8. Gear & Emergency", title: "Air Compressor, 120V Outlets & Mobile Charger", desc: "Verify built-in cargo compressor with hose/kit, 120V bed/cargo outlets, and mobile charger kit." },

      { id: "as-1", category: "9. Acceptance Sign-off", title: "Log Any Open Tickets with Specialist", desc: "Ensure your Rivian Delivery Specialist logs any identified cosmetic or alignment defects in their system before signing acceptance." }
    ];

    const DB_NAME = "rivian_qc_db_v3";
    const DB_VERSION = 1;
    let dbInstance = null;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("items")) db.createObjectStore("items", { keyPath: "id" });
          if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "mediaId" });
        };
        req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
        req.onerror = (e) => reject(e);
      });
    }

    async function dbSaveItem(item) {
      if (!dbInstance) return;
      return new Promise((res, rej) => {
        const tx = dbInstance.transaction("items", "readwrite");
        tx.objectStore("items").put(item);
        tx.oncomplete = () => res();
        tx.onerror = (e) => rej(e);
      });
    }

    async function dbSaveMedia(m) {
      if (!dbInstance) return;
      return new Promise((res, rej) => {
        const tx = dbInstance.transaction("media", "readwrite");
        tx.objectStore("media").put(m);
        tx.oncomplete = () => res();
        tx.onerror = (e) => rej(e);
      });
    }

    async function dbGetMedia(id) {
      if (!dbInstance) return null;
      return new Promise((res) => {
        const tx = dbInstance.transaction("media", "readonly");
        const req = tx.objectStore("media").get(id);
        req.onsuccess = () => res(req.result);
        req.onerror = () => res(null);
      });
    }

    async function dbGetAllItems() {
      if (!dbInstance) return [];
      return new Promise((res) => {
        const tx = dbInstance.transaction("items", "readonly");
        const req = tx.objectStore("items").getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    let appItems = [];
    let activeCategory = "All";
    let filterIssuesOnly = false;
    let pendingMediaItemId = null;
    let activeSpeechRecognition = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingItemId = null;

    async function initApp() {
      try {
        await openDatabase();
        const stored = await dbGetAllItems();
        if (stored && stored.length > 0) {
          const storedMap = new Map(stored.map(i => [i.id, i]));
          appItems = DEFAULT_ITEMS.map(def => {
            const s = storedMap.get(def.id);
            return s ? { ...def, ...s } : { ...def, status: null, severity: 'Cosmetic', notes: '', mediaIds: [] };
          });
        } else {
          appItems = DEFAULT_ITEMS.map(def => ({ ...def, status: null, severity: 'Cosmetic', notes: '', mediaIds: [] }));
          for (const item of appItems) await dbSaveItem(item);
        }
        document.getElementById("db-status").textContent = "IndexedDB Ready & Offline";
      } catch (err) {
        appItems = DEFAULT_ITEMS.map(def => ({ ...def, status: null, severity: 'Cosmetic', notes: '', mediaIds: [] }));
      }

      renderCategoryPills();
      renderChecklist();
      updateHeaderStats();
      setupEventListeners();
    }

    function renderCategoryPills() {
      const c = document.getElementById("category-pills");
      const cats = ["All", ...CHECKLIST_CATEGORIES];
      c.innerHTML = cats.map(cat => {
        const isActive = activeCategory === cat;
        const count = cat === "All" ? appItems.length : appItems.filter(i => i.category === cat).length;
        return `<button data-cat="${cat}" class="cat-btn ${isActive ? 'active' : ''}"><span>${cat}</span> <span style="font-size:10px; opacity:0.8;">(${count})</span></button>`;
      }).join("");

      c.querySelectorAll("button").forEach(b => {
        b.onclick = () => {
          activeCategory = b.getAttribute("data-cat");
          renderCategoryPills();
          renderChecklist();
        };
      });
    }

    function renderChecklist() {
      const c = document.getElementById("checklist-items-container");
      let list = appItems;
      if (activeCategory !== "All") list = list.filter(i => i.category === activeCategory);
      if (filterIssuesOnly) list = list.filter(i => i.status === "issue");

      if (list.length === 0) {
        c.innerHTML = `<div style="text-align:center; padding:40px; background:var(--surface); border:1px solid var(--border); border-radius:16px; color:var(--text-muted);"><p style="color:#fff; font-weight:600;">No items in this view</p></div>`;
        return;
      }

      c.innerHTML = list.map(item => {
        const isPass = item.status === 'pass';
        const isIssue = item.status === 'issue';
        const isNA = item.status === 'na';

        return `
          <div class="item-card ${isIssue ? 'is-issue' : (isPass ? 'is-pass' : '')}">
            <div class="card-top">
              <div>
                <span class="cat-tag">${item.category}</span>
                <div class="card-title">${item.title}</div>
                <div class="card-desc">${item.desc}</div>
              </div>
              <div>
                ${isPass ? '<span class="status-badge badge-pass">PASS</span>' : ''}
                ${isIssue ? '<span class="status-badge badge-issue">ISSUE</span>' : ''}
                ${isNA ? '<span class="status-badge badge-na">N/A</span>' : ''}
              </div>
            </div>

            <div class="btn-group-toggle">
              <button onclick="setItemStatus('${item.id}', 'pass')" class="toggle-btn ${isPass ? 'active-pass' : ''}">✓ Pass</button>
              <button onclick="setItemStatus('${item.id}', 'issue')" class="toggle-btn ${isIssue ? 'active-issue' : ''}">⚠ Issue</button>
              <button onclick="setItemStatus('${item.id}', 'na')" class="toggle-btn ${isNA ? 'active-na' : ''}">— N/A</button>
            </div>

            ${isIssue ? `
              <div class="severity-bar">
                <span>Severity:</span>
                <div class="sev-pills">
                  ${['Cosmetic', 'Moderate', 'Blocker'].map(s => `
                    <button onclick="setItemSeverity('${item.id}', '${s}')" class="sev-btn ${item.severity === s ? 'active-' + s : ''}">${s}</button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <div class="notes-box">
              <div class="notes-header">
                <span>Notes & Observations:</span>
                <div class="notes-btns">
                  <button id="dictate-btn-${item.id}" onclick="toggleDictation('${item.id}')" class="btn-tool">🎙 Dictate</button>
                  <button id="memo-btn-${item.id}" onclick="toggleVoiceMemo('${item.id}')" class="btn-tool">📻 Voice Memo</button>
                </div>
              </div>
              <textarea rows="2" placeholder="Tap dictate or type observations..." oninput="updateItemNotes('${item.id}', this.value)">${item.notes || ''}</textarea>
            </div>

            <div class="media-row">
              <div class="media-thumbs">${(item.mediaIds && item.mediaIds.length) ? item.mediaIds.map(m => `<div onclick="viewMedia('${m}')" class="thumb-item">📷</div>`).join('') : '<span style="font-size:11px; color:#6b7280; font-style:italic;">No media</span>'}</div>
              <div class="media-btns">
                <button onclick="capturePhoto('${item.id}')" class="btn-tool">📷 Photo</button>
                <button onclick="captureVideo('${item.id}')" class="btn-tool">🎥 Video</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    window.setItemStatus = async (id, status) => {
      const it = appItems.find(i => i.id === id);
      if (!it) return;
      it.status = it.status === status ? null : status;
      await dbSaveItem(it);
      renderChecklist();
      updateHeaderStats();
    };

    window.setItemSeverity = async (id, s) => {
      const it = appItems.find(i => i.id === id);
      if (!it) return;
      it.severity = s;
      await dbSaveItem(it);
      renderChecklist();
    };

    window.updateItemNotes = async (id, txt) => {
      const it = appItems.find(i => i.id === id);
      if (!it) return;
      it.notes = txt;
      await dbSaveItem(it);
    };

    window.toggleDictation = (id) => {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) { alert("Speech-to-text is not supported on this browser."); return; }
      const btn = document.getElementById(`dictate-btn-${id}`);
      if (activeSpeechRecognition) {
        activeSpeechRecognition.stop();
        activeSpeechRecognition = null;
        if (btn) btn.classList.remove('recording');
        return;
      }
      const rec = new Speech();
      rec.continuous = true;
      rec.lang = 'en-US';
      rec.onstart = () => { if (btn) { btn.classList.add('recording'); btn.textContent = '⏹ Stop'; } };
      rec.onresult = async (e) => {
        const it = appItems.find(i => i.id === id);
        if (!it) return;
        it.notes = (it.notes ? it.notes + ' ' : '') + e.results[e.results.length - 1][0].transcript;
        await dbSaveItem(it);
        renderChecklist();
      };
      rec.onerror = () => { rec.stop(); activeSpeechRecognition = null; renderChecklist(); };
      rec.onend = () => { activeSpeechRecognition = null; renderChecklist(); };
      activeSpeechRecognition = rec;
      rec.start();
    };

    window.toggleVoiceMemo = async (id) => {
      const btn = document.getElementById(`memo-btn-${id}`);
      if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        recordingItemId = id;
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstart = () => { if (btn) { btn.classList.add('recording'); btn.textContent = '⏹ Stop Rec'; } };
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onloadend = async () => {
            const mId = "memo-" + Date.now();
            await dbSaveMedia({ mediaId: mId, itemId: recordingItemId, type: 'audio', data: reader.result });
            const it = appItems.find(i => i.id === recordingItemId);
            if (it) {
              it.mediaIds = it.mediaIds || [];
              it.mediaIds.push(mId);
              await dbSaveItem(it);
            }
            renderChecklist();
          };
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
      } catch (err) { alert("Microphone access denied or unavailable."); }
    };

    window.capturePhoto = (id) => { pendingMediaItemId = id; document.getElementById("camera-photo-input").click(); };
    window.captureVideo = (id) => { pendingMediaItemId = id; document.getElementById("camera-video-input").click(); };

    document.getElementById("camera-photo-input").onchange = (e) => saveMediaFile(e.target.files[0], 'image');
    document.getElementById("camera-video-input").onchange = (e) => saveMediaFile(e.target.files[0], 'video');

    function saveMediaFile(file, type) {
      if (!file || !pendingMediaItemId) return;
      const reader = new FileReader();
      reader.onloadend = async () => {
        const mId = "media-" + Date.now();
        await dbSaveMedia({ mediaId: mId, itemId: pendingMediaItemId, type: type, data: reader.result });
        const it = appItems.find(i => i.id === pendingMediaItemId);
        if (it) {
          it.mediaIds = it.mediaIds || [];
          it.mediaIds.push(mId);
          await dbSaveItem(it);
        }
        renderChecklist();
      };
      reader.readAsDataURL(file);
    }

    window.viewMedia = async (mId) => {
      const m = await dbGetMedia(mId);
      if (!m) return;
      const c = document.getElementById("media-modal-container");
      if (m.type === 'image') c.innerHTML = `<img src="${m.data}" style="max-width:90vw; max-height:80vh; border-radius:12px; border:1px solid var(--border);" />`;
      else if (m.type === 'video') c.innerHTML = `<video controls autoplay src="${m.data}" style="max-width:90vw; max-height:80vh; border-radius:12px;"></video>`;
      else if (m.type === 'audio') c.innerHTML = `<div style="background:var(--surface); padding:24px; border-radius:16px; border:1px solid var(--border);"><audio controls autoplay src="${m.data}"></audio></div>`;
      document.getElementById("media-modal").classList.remove("hidden");
    };

    document.getElementById("btn-close-media").onclick = () => document.getElementById("media-modal").classList.add("hidden");

    function updateHeaderStats() {
      const completed = appItems.filter(i => i.status !== null).length;
      const total = appItems.length;
      const passes = appItems.filter(i => i.status === 'pass').length;
      const issues = appItems.filter(i => i.status === 'issue').length;

      document.getElementById("stat-completed").textContent = `${completed} / ${total}`;
      document.getElementById("stat-pass").textContent = passes;
      document.getElementById("stat-issues").textContent = issues;
      document.getElementById("dock-issue-summary").textContent = `${issues} Issue${issues === 1 ? '' : 's'} Flagged`;
      document.getElementById("progress-bar-fill").style.width = `${Math.round((completed / total) * 100)}%`;
    }

    function openReportModal() {
      const issues = appItems.filter(i => i.status === 'issue');
      const b = document.getElementById("report-modal-body");
      b.innerHTML = `
        <div style="background:var(--bg-dark); padding:12px 16px; border-radius:12px; border:1px solid var(--border); line-height:1.6;">
          <div><strong style="color:var(--text-muted);">Location:</strong> Bethel Park Service Center (1700 Oxford Dr)</div>
          <div><strong style="color:var(--text-muted);">Vehicle:</strong> Rivian R1S</div>
          <div><strong style="color:var(--text-muted);">Issues Flagged:</strong> <span style="color:${issues.length ? 'var(--danger)' : 'var(--accent)'}; font-weight:700;">${issues.length}</span></div>
        </div>
        ${issues.length === 0 ? '<div style="text-align:center; padding:24px; color:var(--accent); font-weight:700;">Zero defects flagged. All inspected items passed!</div>' : issues.map((iss, idx) => `
          <div style="background:var(--bg-dark); padding:12px; border-radius:12px; border:1px solid rgba(224,83,83,0.4);">
            <div style="display:flex; justify-content:space-between; font-weight:700; color:#fff;">
              <span>${idx + 1}. ${iss.title}</span>
              <span style="color:${iss.severity === 'Blocker' ? 'var(--blocker)' : 'var(--gold)'}; font-size:11px;">[${iss.severity}]</span>
            </div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${iss.category}</div>
            <div style="font-size:12px; color:#fca5a5; margin-top:6px; background:rgba(224,83,83,0.1); padding:8px; border-radius:6px;">
              <strong>Note:</strong> ${iss.notes || 'Cosmetic / fit defect observed during walkthrough.'}
            </div>
          </div>
        `).join('')}
      `;
      document.getElementById("report-modal").classList.remove("hidden");
    }

    function setupEventListeners() {
      document.getElementById("btn-open-report").onclick = openReportModal;
      document.getElementById("btn-dock-report").onclick = openReportModal;
      document.getElementById("btn-close-report").onclick = () => document.getElementById("report-modal").classList.add("hidden");
      document.getElementById("btn-done-report").onclick = () => document.getElementById("report-modal").classList.add("hidden");

      document.getElementById("btn-dock-filter-issues").onclick = () => {
        filterIssuesOnly = !filterIssuesOnly;
        document.getElementById("dock-filter-text").textContent = filterIssuesOnly ? "Show All Items" : "Filter Issues";
        renderChecklist();
      };

      document.getElementById("btn-copy-ticket").onclick = () => {
        const issues = appItems.filter(i => i.status === 'issue');
        let t = "RIVIAN DELIVERY HANDOFF PUNCHLIST - BETHEL PARK\nDate: November 7, 2026\n\n";
        if (!issues.length) t += "Vehicle inspected with zero issues flagged.";
        else issues.forEach((iss, i) => {
          t += `${i+1}. [${iss.severity.toUpperCase()}] ${iss.title}\n`;
          t += `   Category: ${iss.category}\n`;
          t += `   Notes: ${iss.notes || 'Identified during lot walkthrough'}\n\n`;
        });
        navigator.clipboard.writeText(t).then(() => {
          document.getElementById("copy-ticket-text").textContent = "✓ Copied to Clipboard!";
          setTimeout(() => document.getElementById("copy-ticket-text").textContent = "📋 Copy Text Ticket", 2000);
        });
      };

      document.getElementById("btn-print-report").onclick = () => window.print();

      document.getElementById("btn-export-json").onclick = () => {
        const data = { date: new Date().toISOString(), vehicle: "Rivian R1S", items: appItems };
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        a.download = `rivian-qc-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      };

      document.getElementById("btn-import-trigger").onclick = () => document.getElementById("import-file-input").click();
      document.getElementById("import-file-input").onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.items && Array.isArray(parsed.items)) {
              for (const it of parsed.items) await dbSaveItem(it);
              location.reload();
            }
          } catch (err) { alert("Invalid backup JSON file."); }
        };
        reader.readAsText(f);
      };
    }

    // Register simple Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
